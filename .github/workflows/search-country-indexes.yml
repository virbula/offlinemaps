name: Build country-wide search indexes

# Adds a country-wide search index for the federations Geofabrik has no
# country-level extract for.
#
# The United States exists only as 51 state extracts and Canada as 13
# provincial ones, so the per-extract build leaves those countries with no
# single index. A user who downloads the "United States" aggregate map would
# otherwise have to fetch 51 separate search indexes to search it.
#
# Extracted from each country's own PBF, not merged from its regional indexes.
# Merging was measured to duplicate streets that straddle a boundary: each
# extract computes its own centroid for the same road, so the dedup key differs
# and both rows survive. Roughly 1% of street rows across a single boundary
# between two Dutch provinces, which the United States, with 51 extracts and
# far more internal borders, would multiply. Locality inference degrades the
# same way, since a border street can only inherit a settlement present in its
# own extract.
#
# The cost is about 32 GB of downloads and a full reparse, the United States
# being 12.1 GB of it. Worth paying: duplicate street entries are exactly what
# a user notices first.
#
# Runs after the per-extract build for the same tier has finished, and uploads
# into that same release -- following the country road maps, where a country
# aggregate lives alongside the regional assets rather than in a release of
# its own.

on:
  workflow_dispatch:
    inputs:
      tier:
        description: Which index family to extend
        required: true
        type: choice
        options: [places, addresses]
        default: places
      version:
        description: Release version, e.g. 2026.08.1
        required: true
        type: string
      dry_run:
        description: Plan only, upload nothing
        required: true
        type: boolean
        default: true
      source_date:
        description: >
          Geofabrik snapshot for the country PBFs, e.g. 260811. Blank resolves
          it from discovery, which means today's snapshot rather than the one
          the regional indexes were built from.
        required: false
        type: string
        default: ''

concurrency:
  group: offlinemaps-search-country-${{ inputs.tier }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  DART_VERSION: '3.12.2'

jobs:
  guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require a trusted manual run
        env:
          EVENT_NAME: ${{ github.event_name }}
          REPOSITORY: ${{ github.repository }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          test "$EVENT_NAME" = workflow_dispatch
          test "$REPOSITORY" = virbula/offlinemaps
          [[ "$INPUT_VERSION" =~ ^[0-9]{4}\.[0-9]{2}\.[0-9]+$ ]]

  prepare:
    needs: guard
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    # Write, for a job that only reads. GitHub shows draft releases solely to
    # callers with push access, and the search releases stay drafts until they
    # are deliberately published, so contents: read cannot see the release this
    # job has to check and reports "release not found". search-indexes.yml
    # already grants write to every job for the same reason; this workflow
    # granted it to build alone, so prepare and finalize both failed.
    permissions:
      contents: write
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      release_tag: ${{ steps.plan.outputs.release_tag }}
      country_count: ${{ steps.plan.outputs.country_count }}
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      INPUT_TIER: ${{ inputs.tier }}
      INPUT_VERSION: ${{ inputs.version }}
      INPUT_SOURCE_DATE: ${{ inputs.source_date }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dart-lang/setup-dart@65eb853c7ba17dde3be364c3d2858773e7144260 # v1
        with:
          sdk: ${{ env.DART_VERSION }}
      - run: make deps

      - name: Resolve the extracts and plan the country indexes
        id: plan
        run: |
          set -euo pipefail
          mkdir -p build/search-inputs
          dart run tool/offline_maps/discover_routing_sources.dart \
            --manifest config/offline-map-build.json \
            --output-manifest build/search-inputs/source-with-routing.json \
            --cache-dir build/search-inputs/cache
          # The snapshot the country PBFs are taken from. Resolving it here
          # means today's date, not the date the per-extract indexes in this
          # same release were built from, and those have already diverged: the
          # places tier is 295 indexes from 260811 and one from 260815, while
          # addresses is 296 from 260816. A country index built from a third
          # date would sit beside them under the same 2026.08.1 label while
          # describing different ground, so the caller can pin it.
          if [[ -n "${INPUT_SOURCE_DATE:-}" ]]; then
            source_date="$INPUT_SOURCE_DATE"
            echo "  cycle snapshot: $source_date (pinned)"
          else
            source_date="$(jq -r '[.routingDataset.graphs[].url
              | capture("-(?<d>[0-9]{6})\\.osm\\.pbf$").d]
              | group_by(.) | max_by(length) | .[0]' \
              build/search-inputs/source-with-routing.json)"
            echo "  cycle snapshot: $source_date (resolved from discovery)"
          fi
          [[ "$source_date" =~ ^[0-9]{6}$ ]]
          dart run tool/offline_maps/plan_search_release.dart \
            --manifest build/search-inputs/source-with-routing.json \
            --output-dir build/search-plan \
            --tier "$INPUT_TIER" --version "$INPUT_VERSION" \
            --geofabrik-index build/search-inputs/cache/geofabrik-index.json \
            --source-date "$source_date"
          matrix="$(jq -c '{include:[.countryIndexes[]|{
            country:.countryCode, file:.file, source:.sourceUrl}]}' \
            build/search-plan/search-plan.json)"
          test "${#matrix}" -lt 900000
          count="$(jq -r '.countryIndexCount' build/search-plan/search-plan.json)"
          test "$count" -ge 1
          tag="$(jq -er '.releaseTag' build/search-plan/search-plan.json)"
          printf 'matrix=%s\nrelease_tag=%s\ncountry_count=%s\n' \
            "$matrix" "$tag" "$count" >> "$GITHUB_OUTPUT"
          jq -r '.countryIndexes[]|"  \(.countryCode)  \(.graphIds|length) extracts -> \(.file)"' \
            build/search-plan/search-plan.json

      - name: Require the per-extract build to have finished first
        run: |
          set -euo pipefail
          # Extracting from a country PBF no longer depends on the regional
          # indexes, so this is about the release rather than correctness: a
          # country index published into a half-built release would look like
          # the release was complete when most of its regions were still
          # missing. Waiting also keeps the two builds off the same runners.
          tag="$(jq -er '.releaseTag' build/search-plan/search-plan.json)"
          want="$(jq -r '.indexCount' build/search-plan/search-plan.json)"
          got="$(gh release view "$tag" -R "${{ github.repository }}" \
            --json assets --jq '[.assets[]|select(.name|endswith(".sqlite.gz"))]|length')"
          echo "  $got of $want per-extract indexes present on $tag"
          test "$got" -ge "$want"

  build:
    needs: prepare
    if: inputs.dry_run != true
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: write
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.matrix).include }}
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPOSITORY: ${{ github.repository }}
      RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
      COUNTRY: ${{ matrix.country }}
      OUT_FILE: ${{ matrix.file }}
      SOURCE_URL: ${{ matrix.source }}
      INPUT_TIER: ${{ inputs.tier }}
      INPUT_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Reclaim runner disk
        run: |
          set -euo pipefail
          # The United States PBF alone is 12.1 GB, plus the node location
          # cache and the index, which a stock runner's ~14 GB will not hold.
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          df -h / | awk 'NR==2 {print "  free after reclaim: " $4}'

      - name: Install the extractor runtime
        run: |
          set -euo pipefail
          python3 -m venv build/osmvenv
          build/osmvenv/bin/pip install --quiet --require-hashes --no-deps \
            -r tool/offline_maps/search-requirements.txt

      - name: Extract the country index from its own PBF
        run: |
          set -euo pipefail
          mkdir -p build/country
          pbf="build/country/$COUNTRY.osm.pbf"
          curl --fail-with-body --location --silent --show-error \
            --proto '=https' --tlsv1.2 \
            --connect-timeout 15 --max-time 7200 --retry 5 \
            --retry-all-errors --retry-delay 5 \
            --output "$pbf" "$SOURCE_URL"
          # Geofabrik publishes an MD5 beside every dated extract; a truncated
          # or substituted download would otherwise be indexed and published.
          want="$(curl --fail --silent --max-time 120 "$SOURCE_URL.md5" | awk '{print $1}')"
          got="$(md5sum "$pbf" | awk '{print $1}')"
          test "$got" = "$want" || {
            echo "ERROR: $COUNTRY checksum $got != $want" >&2; exit 1; }
          echo "  $COUNTRY source verified: $(du -h "$pbf" | cut -f1)"

          tiers=settlements,streets,pois
          if [[ "$INPUT_TIER" == addresses ]]; then
            tiers=settlements,streets,pois,addresses
          fi
          build/osmvenv/bin/python tool/offline_maps/build_search_index.py \
            --input "$pbf" \
            --output "build/${OUT_FILE%.gz}" \
            --region-id "$COUNTRY-country" \
            --version "$INPUT_VERSION" \
            --tiers "$tiers" \
            --compress \
            --descriptor "build/$COUNTRY.descriptor.json"
          rm -f "$pbf"
          test "$(jq -er '.file' "build/$COUNTRY.descriptor.json")" = "$OUT_FILE"
          gh release upload "$RELEASE_TAG" "build/$OUT_FILE" \
            -R "$REPOSITORY" --clobber
          rm -rf build/country "build/$OUT_FILE"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: country-descriptor-${{ github.run_id }}-${{ matrix.country }}
          path: build/${{ matrix.country }}.descriptor.json
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  finalize:
    needs: [prepare, build]
    if: inputs.dry_run != true
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Same reason as prepare: it counts assets on a draft release.
    permissions:
      contents: write
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPOSITORY: ${{ github.repository }}
      RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
      EXPECTED: ${{ needs.prepare.outputs.country_count }}
    steps:
      - name: Require every country index to be present
        run: |
          set -euo pipefail
          got="$(gh release view "$RELEASE_TAG" -R "$REPOSITORY" --json assets \
            --jq '[.assets[]|select(.name|test("-country-[0-9]{4}\\.[0-9]{2}\\.[0-9]+\\.sqlite\\.gz$"))]|length')"
          echo "  $got of $EXPECTED country indexes on $RELEASE_TAG"
          test "$got" = "$EXPECTED"
