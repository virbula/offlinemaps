name: Backfill offline routing graphs

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Validate discovery and the 3.6.3 build plan without publishing
        required: true
        type: boolean
        default: false

concurrency:
  group: offlinemaps-release
  cancel-in-progress: false

permissions:
  contents: read

env:
  DART_VERSION: '3.12.2'

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dart-lang/setup-dart@65eb853c7ba17dde3be364c3d2858773e7144260 # v1
        with:
          sdk: ${{ env.DART_VERSION }}
      - run: make check

  prepare:
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: write
    outputs:
      matrix: ${{ steps.outputs.outputs.matrix }}
      no_op: ${{ steps.outputs.outputs.no_op }}
      requires_build: ${{ steps.outputs.outputs.requires_build }}
      dry_run: ${{ steps.outputs.outputs.dry_run }}
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPOSITORY: ${{ github.repository }}
      TARGET: ${{ github.sha }}
      INPUT_DRY_RUN: ${{ inputs.dry_run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dart-lang/setup-dart@65eb853c7ba17dde3be364c3d2858773e7144260 # v1
        with:
          sdk: ${{ env.DART_VERSION }}
      - run: make deps
      - name: Discover immutable graph sources and create coordinated drafts
        run: |
          set -euo pipefail
          extra=()
          if [[ "$INPUT_DRY_RUN" == "true" ]]; then extra+=(--dry-run); fi
          dart run tool/offline_maps/prepare_routing_backfill.dart \
            --repository "$REPOSITORY" \
            --target "$TARGET" \
            --config config/offline-map-build.json \
            --base-catalog catalog.json \
            --output-dir build/plan \
            --cache-dir build/cache \
            "${extra[@]}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: routing-plan-${{ github.run_id }}
          path: build/plan/
          if-no-files-found: error
          retention-days: 30
          compression-level: 9
          overwrite: true
      - name: Expose bounded matrix
        id: outputs
        run: |
          set -euo pipefail
          matrix="$(jq -c . build/plan/matrix.json)"
          test "${#matrix}" -lt 900000
          jq -e '.noOp | type == "boolean"' build/plan/release.json >/dev/null
          jq -e '.requiresBuild | type == "boolean"' build/plan/release.json >/dev/null
          no_op="$(jq -r '.noOp' build/plan/release.json)"
          requires_build="$(jq -r '.requiresBuild' build/plan/release.json)"
          printf 'matrix=%s\nno_op=%s\nrequires_build=%s\ndry_run=%s\n' \
            "$matrix" "$no_op" "$requires_build" "$INPUT_DRY_RUN" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    if: needs.prepare.outputs.dry_run != 'true'
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    permissions:
      contents: write
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      SHARD: ${{ matrix.shard }}
      REGION_IDS_JSON: ${{ toJSON(matrix.regionIds) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dart-lang/setup-dart@65eb853c7ba17dde3be364c3d2858773e7144260 # v1
        with:
          sdk: ${{ env.DART_VERSION }}
      - run: make deps
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: routing-plan-${{ github.run_id }}
          path: build/plan
      - name: Pull the immutable Valhalla 3.6.3 builder
        if: needs.prepare.outputs.requires_build == 'true'
        run: |
          set -euo pipefail
          image="$(jq -er '.routingBuilder.image' build/plan/manifest.json)"
          test "$image" = 'ghcr.io/valhalla/valhalla:3.6.3@sha256:2b19ea46551a9687b245022551183829d817fdee9b58c5e7b2adb6e422749c43'
          docker pull "$image"
      - name: Build, verify, upload, and clean each graph
        run: |
          set -euo pipefail
          region_ids="$(jq -er 'if type == "array" and length >= 1 and length <= 3 and all(.[]; test("^[a-z0-9][a-z0-9._-]{0,62}$")) then join(",") else error("invalid routing matrix") end' <<< "$REGION_IDS_JSON")"
          dart run tool/offline_maps/build_routing_backfill_shard.dart \
            --manifest build/plan/manifest.json \
            --release build/plan/release.json \
            --shard "$SHARD" \
            --region-ids "$region_ids" \
            --output-dir build/pack \
            --report "build/report-$SHARD.json"
          test -z "$(find build/pack -type f \( -name '*.vtiles.tar' -o -name '*.osm.pbf' \) -print -quit)"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: routing-report-${{ github.run_id }}-${{ matrix.shard }}
          path: build/report-${{ matrix.shard }}.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 9
          overwrite: true

  finalize:
    needs: [prepare, build]
    if: needs.prepare.outputs.dry_run != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: write
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPOSITORY: ${{ github.repository }}
      CHECKOUT_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dart-lang/setup-dart@65eb853c7ba17dde3be364c3d2858773e7144260 # v1
        with:
          sdk: ${{ env.DART_VERSION }}
      - run: make deps
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: routing-plan-${{ github.run_id }}
          path: build/plan
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: routing-report-${{ github.run_id }}-*
          path: build/reports
          merge-multiple: false
      - name: Join the immutable releases and promote the catalog
        run: |
          set -euo pipefail
          dart run tool/offline_maps/finalize_routing_backfill.dart \
            --manifest build/plan/manifest.json \
            --release build/plan/release.json \
            --base-catalog build/plan/base-catalog.json \
            --reports-dir build/reports \
            --output-dir build/metadata
      - name: Atomically sync verified metadata to main
        run: |
          set -euo pipefail
          dart run tool/offline_maps/sync_routing_backfill_metadata.dart \
            --repository "$REPOSITORY" \
            --expected-head "$CHECKOUT_SHA" \
            --plan-dir build/plan \
            --metadata-dir build/metadata
