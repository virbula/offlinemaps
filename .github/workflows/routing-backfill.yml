name: Backfill offline routing graphs

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Validate discovery and the 3.6.3 build plan without publishing
        required: true
        type: boolean
        default: false
      expected_plan_sha:
        description: Immutable routing plan SHA-256 for a continuation run
        required: false
        type: string
        default: ''
      iteration:
        description: Bounded continuation counter
        required: true
        type: string
        default: '0'

concurrency:
  group: offlinemaps-release
  queue: max
  cancel-in-progress: false

permissions:
  contents: read

env:
  DART_VERSION: '3.12.2'

jobs:
  guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require a trusted main-branch manual run
        env:
          EVENT_NAME: ${{ github.event_name }}
          REPOSITORY: ${{ github.repository }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          test "$EVENT_NAME" = workflow_dispatch
          test "$REPOSITORY" = virbula/offlinemaps
          test "$REF" = refs/heads/main

  check:
    needs: guard
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dart-lang/setup-dart@65eb853c7ba17dde3be364c3d2858773e7144260 # v1
        with:
          sdk: ${{ env.DART_VERSION }}
      - run: make check

  prepare:
    needs: [guard, check]
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: write
    outputs:
      matrix: ${{ steps.outputs.outputs.matrix }}
      no_op: ${{ steps.outputs.outputs.no_op }}
      requires_build: ${{ steps.outputs.outputs.requires_build }}
      dry_run: ${{ steps.outputs.outputs.dry_run }}
      pending: ${{ steps.outputs.outputs.pending }}
      plan_sha: ${{ steps.outputs.outputs.plan_sha }}
      iteration: ${{ steps.outputs.outputs.iteration }}
      source_exact_bytes: ${{ steps.outputs.outputs.source_exact_bytes }}
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPOSITORY: ${{ github.repository }}
      TARGET: ${{ github.sha }}
      INPUT_DRY_RUN: ${{ inputs.dry_run }}
      INPUT_EXPECTED_PLAN_SHA: ${{ inputs.expected_plan_sha }}
      INPUT_ITERATION: ${{ inputs.iteration }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dart-lang/setup-dart@65eb853c7ba17dde3be364c3d2858773e7144260 # v1
        with:
          sdk: ${{ env.DART_VERSION }}
      - run: make deps
      - name: Discover immutable graph sources and create coordinated drafts
        run: |
          set -euo pipefail
          extra=()
          if [[ "$INPUT_DRY_RUN" == "true" ]]; then extra+=(--dry-run); fi
          dart run tool/offline_maps/prepare_routing_backfill.dart \
            --repository "$REPOSITORY" \
            --target "$TARGET" \
            --config config/offline-map-build.json \
            --base-catalog catalog.json \
            --output-dir build/plan \
            --cache-dir build/cache \
            "${extra[@]}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: routing-plan-${{ github.run_id }}
          path: |
            build/plan/manifest.json
            build/plan/release.json
            build/plan/base-catalog.json
            build/plan/reports/
          if-no-files-found: error
          retention-days: 7
          compression-level: 9
          overwrite: true
      - name: Expose bounded matrix
        id: outputs
        run: |
          set -euo pipefail
          matrix="$(jq -c . build/plan/matrix.json)"
          test "${#matrix}" -lt 900000
          jq -e '.include | length <= 1' build/plan/matrix.json >/dev/null
          jq -e 'all(.include[]; (.regionIds | length >= 1 and length <= 3) and (.maximumSourceExactBytes | type == "number" and . > 0) and (.aggregateSourceExactBytes | type == "number" and . >= .maximumSourceExactBytes))' build/plan/matrix.json >/dev/null
          jq -e '.noOp | type == "boolean"' build/plan/release.json >/dev/null
          jq -e '.requiresBuild | type == "boolean"' build/plan/release.json >/dev/null
          no_op="$(jq -r '.noOp' build/plan/release.json)"
          requires_build="$(jq -r '.requiresBuild' build/plan/release.json)"
          pending="$(jq -er '.pending | select(type == "boolean")' build/plan/release.json)"
          plan_sha="$(jq -er '.routingPlanSha256 | select(test("^[a-f0-9]{64}$"))' build/plan/release.json)"
          source_exact_bytes="$(jq -er '.routingSourceExactBytes | select(type == "number" and . > 0)' build/plan/release.json)"
          [[ "$INPUT_ITERATION" =~ ^[0-9]{1,3}$ ]]
          (( 10#$INPUT_ITERATION <= 297 ))
          if [[ -n "$INPUT_EXPECTED_PLAN_SHA" ]]; then
            [[ "$INPUT_EXPECTED_PLAN_SHA" =~ ^[a-f0-9]{64}$ ]]
            (( 10#$INPUT_ITERATION >= 1 ))
            test "$INPUT_EXPECTED_PLAN_SHA" = "$plan_sha"
          else
            test "$INPUT_ITERATION" = 0
          fi
          if [[ "$pending" == true ]]; then jq -e '.include | length == 1' build/plan/matrix.json >/dev/null; else jq -e '.include | length == 0' build/plan/matrix.json >/dev/null; fi
          printf 'matrix=%s\nno_op=%s\nrequires_build=%s\ndry_run=%s\npending=%s\nplan_sha=%s\niteration=%s\nsource_exact_bytes=%s\n' \
            "$matrix" "$no_op" "$requires_build" "$INPUT_DRY_RUN" "$pending" "$plan_sha" "$INPUT_ITERATION" "$source_exact_bytes" >> "$GITHUB_OUTPUT"

  prefetch:
    needs: prepare
    if: >-
      needs.prepare.outputs.dry_run != 'true' &&
      needs.prepare.outputs.pending == 'true' &&
      github.event_name == 'workflow_dispatch' &&
      github.repository == 'virbula/offlinemaps' &&
      github.ref == 'refs/heads/main'
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 1440
    env:
      ROUTING_CACHE_ROOT: ${{ runner.tool_cache }}/../easyelevation-routing-source-cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dart-lang/setup-dart@65eb853c7ba17dde3be364c3d2858773e7144260 # v1
        with:
          sdk: ${{ env.DART_VERSION }}
      - run: make deps
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: routing-plan-${{ github.run_id }}
          path: build/plan
      - name: Cache every immutable source before any graph is uploaded
        run: |
          set -euo pipefail
          plan_sha256="$(jq -er '.routingPlanSha256 | select(test("^[a-f0-9]{64}$"))' build/plan/release.json)"
          mkdir -p "$ROUTING_CACHE_ROOT"
          free_disk_bytes="$(df -Pk "$ROUTING_CACHE_ROOT" | awk 'NR==2 {print $4 * 1024}')"
          marker="$ROUTING_CACHE_ROOT/$plan_sha256/ready.json"
          if [[ -f "$marker" ]]; then
            required_disk_bytes="$((100 * 1024 * 1024 * 1024))"
          else
            required_disk_bytes="$(( $(jq -er '.routingSourceExactBytes' build/plan/release.json) + 100 * 1024 * 1024 * 1024 ))"
          fi
          test "$free_disk_bytes" -ge "$required_disk_bytes" || { echo "ERROR: Routing prefetch requires $required_disk_bytes free bytes before caching." >&2; exit 1; }
          dart run tool/offline_maps/prefetch_routing_sources.dart \
            --manifest build/plan/manifest.json \
            --plan-sha256 "$plan_sha256" \
            --cache-root "$ROUTING_CACHE_ROOT"

  build:
    needs: [prepare, prefetch]
    if: >-
      needs.prepare.outputs.dry_run != 'true' &&
      needs.prepare.outputs.pending == 'true' &&
      github.event_name == 'workflow_dispatch' &&
      github.repository == 'virbula/offlinemaps' &&
      github.ref == 'refs/heads/main'
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 1440
    permissions:
      contents: write
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      SHARD: ${{ fromJSON(needs.prepare.outputs.matrix).include[0].shard }}
      REGION_IDS_JSON: ${{ toJSON(fromJSON(needs.prepare.outputs.matrix).include[0].regionIds) }}
      MAXIMUM_SOURCE_EXACT_BYTES: ${{ fromJSON(needs.prepare.outputs.matrix).include[0].maximumSourceExactBytes }}
      AGGREGATE_SOURCE_EXACT_BYTES: ${{ fromJSON(needs.prepare.outputs.matrix).include[0].aggregateSourceExactBytes }}
      ROUTING_CACHE_ROOT: ${{ runner.tool_cache }}/../easyelevation-routing-source-cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dart-lang/setup-dart@65eb853c7ba17dde3be364c3d2858773e7144260 # v1
        with:
          sdk: ${{ env.DART_VERSION }}
      - run: make deps
      - name: Verify graph-build disk and memory capacity
        run: |
          set -euo pipefail
          free_disk_bytes="$(df -Pk . | awk 'NR==2 {print $4 * 1024}')"
          if [[ "$(uname -s)" == Darwin ]]; then
            memory_bytes="$(sysctl -n hw.memsize)"
          else
            memory_bytes="$(awk '/MemTotal:/ {print $2 * 1024}' /proc/meminfo)"
          fi
          docker_memory_bytes="$(docker info --format '{{.MemTotal}}')"
          dart run tool/offline_maps/check_routing_build_capacity.dart \
            --maximum-source-bytes "$MAXIMUM_SOURCE_EXACT_BYTES" \
            --aggregate-source-bytes "$AGGREGATE_SOURCE_EXACT_BYTES" \
            --free-disk-bytes "$free_disk_bytes" \
            --memory-bytes "$memory_bytes" \
            --docker-memory-bytes "$docker_memory_bytes"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: routing-plan-${{ github.run_id }}
          path: build/plan
      - name: Pull the immutable Valhalla 3.6.3 builder
        if: needs.prepare.outputs.requires_build == 'true'
        run: |
          set -euo pipefail
          image="$(jq -er '.routingBuilder.image' build/plan/manifest.json)"
          test "$image" = 'ghcr.io/valhalla/valhalla:3.6.3@sha256:0cf1520c6a38b8a7e13a1931541e0ab6e9e42b64b4ca014293b6b8373d493160'
          if ! docker image inspect "$image" >/dev/null 2>&1; then
            for attempt in 1 2 3 4 5; do
              docker pull --platform linux/amd64 "$image" && break
              test "$attempt" -lt 5
              sleep "$((1 << (attempt - 1)))"
            done
          fi
          test "$(docker image inspect "$image" --format '{{.Os}}/{{.Architecture}}')" = linux/amd64
      - name: Build, verify, upload, and clean each graph
        run: |
          set -euo pipefail
          region_ids="$(jq -er 'if type == "array" and length >= 1 and length <= 3 and all(.[]; test("^[a-z0-9][a-z0-9._-]{0,62}$")) then join(",") else error("invalid routing matrix") end' <<< "$REGION_IDS_JSON")"
          dart run tool/offline_maps/build_routing_backfill_shard.dart \
            --manifest build/plan/manifest.json \
            --release build/plan/release.json \
            --shard "$SHARD" \
            --region-ids "$region_ids" \
            --source-cache-root "$ROUTING_CACHE_ROOT" \
            --output-dir build/pack \
            --report "build/report-$SHARD.json"
          test -z "$(find build/pack -type f \( -name '*.vtiles.tar' -o -name '*.vtiles.tar.part*' -o -name '*.vtiles.descriptor.json' -o -name '*.osm.pbf' \) -print -quit)"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: routing-report-${{ github.run_id }}
          path: build/report-${{ env.SHARD }}.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 9
          overwrite: true

  continue:
    needs: [prepare, build]
    if: >-
      needs.prepare.outputs.pending == 'true' &&
      needs.prepare.outputs.dry_run != 'true' &&
      github.repository == 'virbula/offlinemaps' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PLAN_SHA: ${{ needs.prepare.outputs.plan_sha }}
      ITERATION: ${{ needs.prepare.outputs.iteration }}
      REPOSITORY: ${{ github.repository }}
    steps:
      - name: Dispatch the next exact-plan shard
        run: |
          set -euo pipefail
          [[ "$PLAN_SHA" =~ ^[a-f0-9]{64}$ ]]
          [[ "$ITERATION" =~ ^[0-9]{1,3}$ ]]
          next_iteration="$((10#$ITERATION + 1))"
          test "$next_iteration" -le 297
          body="$(jq -cn --arg plan "$PLAN_SHA" --arg iteration "$next_iteration" '{ref:"main",inputs:{dry_run:"false",expected_plan_sha:$plan,iteration:$iteration}}')"
          curl --fail-with-body --silent --show-error \
            --proto '=https' --tlsv1.2 \
            --connect-timeout 15 --max-time 60 \
            --request POST \
            --header "Authorization: Bearer $GITHUB_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$REPOSITORY/actions/workflows/routing-backfill.yml/dispatches" \
            --data "$body"

  finalize:
    needs: [prepare, build]
    if: >-
      always() &&
      needs.prepare.result == 'success' &&
      needs.prepare.outputs.pending == 'false' &&
      needs.prepare.outputs.dry_run != 'true' &&
      github.event_name == 'workflow_dispatch' &&
      github.repository == 'virbula/offlinemaps' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: write
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPOSITORY: ${{ github.repository }}
      CHECKOUT_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dart-lang/setup-dart@65eb853c7ba17dde3be364c3d2858773e7144260 # v1
        with:
          sdk: ${{ env.DART_VERSION }}
      - run: make deps
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: routing-plan-${{ github.run_id }}
          path: build/plan
      - name: Join the immutable releases and promote the catalog
        run: |
          set -euo pipefail
          dart run tool/offline_maps/finalize_routing_backfill.dart \
            --manifest build/plan/manifest.json \
            --release build/plan/release.json \
            --base-catalog build/plan/base-catalog.json \
            --reports-dir build/plan/reports \
            --output-dir build/metadata
      - name: Atomically sync verified metadata to main
        run: |
          set -euo pipefail
          dart run tool/offline_maps/sync_routing_backfill_metadata.dart \
            --repository "$REPOSITORY" \
            --expected-head "$CHECKOUT_SHA" \
            --plan-dir build/plan \
            --metadata-dir build/metadata

  cleanup-cache:
    needs: [prepare, finalize]
    if: >-
      needs.finalize.result == 'success' &&
      needs.prepare.outputs.pending == 'false' &&
      needs.prepare.outputs.dry_run != 'true' &&
      github.repository == 'virbula/offlinemaps' &&
      github.ref == 'refs/heads/main'
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 30
    env:
      ROUTING_CACHE_ROOT: ${{ runner.tool_cache }}/../easyelevation-routing-source-cache
      PLAN_SHA: ${{ needs.prepare.outputs.plan_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dart-lang/setup-dart@65eb853c7ba17dde3be364c3d2858773e7144260 # v1
        with:
          sdk: ${{ env.DART_VERSION }}
      - run: make deps
      - name: Remove only the successfully published exact-plan cache
        run: |
          set -euo pipefail
          dart run tool/offline_maps/cleanup_routing_cache.dart \
            --cache-root "$ROUTING_CACHE_ROOT" \
            --plan-sha256 "$PLAN_SHA"
