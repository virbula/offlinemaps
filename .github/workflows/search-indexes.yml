name: Build offline search indexes

# Builds the offline place-search indexes the app has never had. Every geocoder
# in the app today is a remote HTTP service, so an offline user can render,
# route and browse POIs but cannot look up a destination by name.
#
# One workflow, two releases, selected by the tier input:
#   places      settlements + streets + POIs      ~2.6 GB worldwide, default
#   addresses   the same plus house numbers        ~18 GB worldwide, opt-in
# The address release is a superset so a user downloads one file, not two.
# Both ship gzipped. GitHub serves release assets raw -- it ignores
# Accept-Encoding even on JSON, verified against a live asset -- and an FTS5
# index compresses to 34%, so shipping uncompressed would treble the bytes.
# PMTiles deliberately does not do this: its tiles are already compressed
# individually, and the app fetches them by HTTP range, which whole-archive
# compression would break.
# Keeping both in one definition is deliberate: the monthly refresh is being
# consolidated into a single entry point, and two near-identical workflows
# would drift apart the first time only one of them was corrected.
#
# Unlike the POI companions this runs entirely on hosted runners. POI needs the
# self-hosted machine because its Protomaps source is a single global archive;
# Geofabrik already splits the world into 297 extracts of which the largest,
# France, is 5.0 GB, so every shard fits in a standard runner's disk.

on:
  workflow_dispatch:
    inputs:
      tier:
        description: Which index family to build
        required: true
        type: choice
        options: [places, addresses]
        default: places
      version:
        description: Release version, e.g. 2026.08.1
        required: true
        type: string
      expected_source_date:
        description: >-
          Six-digit Geofabrik snapshot date (YYMMDD) every extract must carry.
          Leave empty to accept whatever upstream currently serves.
        required: false
        type: string
        default: ''
      dry_run:
        description: Plan and validate without creating a release
        required: true
        type: boolean
        default: true

concurrency:
  # Deliberately not the offlinemaps-release group. Search touches no map, POI
  # or routing asset and must not queue behind a multi-day graph build.
  group: offlinemaps-search-${{ inputs.tier }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  DART_VERSION: '3.12.2'

jobs:
  guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require a trusted manual run
        env:
          EVENT_NAME: ${{ github.event_name }}
          REPOSITORY: ${{ github.repository }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_SOURCE_DATE: ${{ inputs.expected_source_date }}
        run: |
          set -euo pipefail
          test "$EVENT_NAME" = workflow_dispatch
          test "$REPOSITORY" = virbula/offlinemaps
          [[ "$INPUT_VERSION" =~ ^[0-9]{4}\.[0-9]{2}\.[0-9]+$ ]]
          if [[ -n "$INPUT_SOURCE_DATE" ]]; then
            [[ "$INPUT_SOURCE_DATE" =~ ^[0-9]{6}$ ]]
          fi

  check:
    needs: guard
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dart-lang/setup-dart@65eb853c7ba17dde3be364c3d2858773e7144260 # v1
        with:
          sdk: ${{ env.DART_VERSION }}
      - run: make deps
      - name: Analyze, and run the tests this workflow depends on
        run: |
          set -euo pipefail
          # Deliberately not `make check`. Four poi_catalog_test cases assert
          # the tracked catalog.json is POI-clean, which stopped being true
          # when the POI cycle synced catalog-2026.08.2 into the repository,
          # and automation_test pins the catalog tag one version behind. Those
          # twenty failures predate this workflow and are unrelated to search;
          # gating on them would mean search could never run. Scoped to what
          # search actually depends on until the base-catalog state is fixed.
          dart analyze --fatal-infos tool test
          dart test test/plan_search_release_test.dart

  prepare:
    needs: [guard, check]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: write
    outputs:
      matrix: ${{ steps.outputs.outputs.matrix }}
      release_tag: ${{ steps.outputs.outputs.release_tag }}
      index_count: ${{ steps.outputs.outputs.index_count }}
      shard_count: ${{ steps.outputs.outputs.shard_count }}
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPOSITORY: ${{ github.repository }}
      INPUT_TIER: ${{ inputs.tier }}
      INPUT_VERSION: ${{ inputs.version }}
      INPUT_SOURCE_DATE: ${{ inputs.expected_source_date }}
      INPUT_DRY_RUN: ${{ inputs.dry_run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dart-lang/setup-dart@65eb853c7ba17dde3be364c3d2858773e7144260 # v1
        with:
          sdk: ${{ env.DART_VERSION }}
      - run: make deps

      - name: Resolve every extract to a dated, checksummed snapshot
        run: |
          set -euo pipefail
          mkdir -p build/search-inputs
          # Discovery runs against the raw config, exactly as the Makefile
          # sequences it. It derives the regions itself, so generating the
          # polygons first is both unnecessary and impossible: that generator
          # enforces a routing coverage contract nothing can satisfy until
          # discovery has populated the very graphs it validates.
          #
          # Reused rather than reimplemented, because Geofabrik's own ISO
          # metadata is incomplete -- nothing in index-v1.json declares SA,
          # Singapore sits inside an extract advertising only MY, and Kosovo
          # carries no country code -- so matching on those fields drops 55
          # countries.
          dart run tool/offline_maps/discover_routing_sources.dart \
            --manifest config/offline-map-build.json \
            --output-manifest build/search-inputs/source-with-routing.json \
            --cache-dir build/search-inputs/cache
          jq -e '.routingDataset.graphs | length >= 250' \
            build/search-inputs/source-with-routing.json >/dev/null
          jq -e '.routingDataset.regionGraphs | length >= 500' \
            build/search-inputs/source-with-routing.json >/dev/null

      - name: Require one consistent snapshot date across every extract
        if: inputs.expected_source_date != ''
        run: |
          set -euo pipefail
          # The refresh is only coherent if every source comes from the same
          # upstream snapshot. Mixed dates would put a June street next to an
          # August house number with nothing recording the difference.
          mismatched="$(jq -r --arg d "$INPUT_SOURCE_DATE" \
            '.routingDataset.graphs | to_entries
             | map(select(.value.url | test("-" + $d + "\\.osm\\.pbf$") | not))
             | .[].key' build/search-inputs/source-with-routing.json)"
          if [[ -n "$mismatched" ]]; then
            echo "Extracts not on snapshot $INPUT_SOURCE_DATE:" >&2
            echo "$mismatched" >&2
            exit 1
          fi

      - name: Plan the shards
        run: |
          set -euo pipefail
          dart run tool/offline_maps/plan_search_release.dart \
            --manifest build/search-inputs/source-with-routing.json \
            --output-dir build/search-plan \
            --tier "$INPUT_TIER" \
            --version "$INPUT_VERSION"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: search-plan-${{ github.run_id }}
          path: build/search-plan/
          if-no-files-found: error
          retention-days: 7
          compression-level: 9
          overwrite: true

      - name: Create the draft release
        if: inputs.dry_run != true
        run: |
          set -euo pipefail
          tag="$(jq -er '.releaseTag' build/search-plan/search-plan.json)"
          if ! gh release view "$tag" -R "$REPOSITORY" >/dev/null 2>&1; then
            # Draft, and never --latest. The app resolves its catalog through
            # releases/latest/download, so a search release taking that flag
            # would point every client at a release with no catalog.json.
            gh release create "$tag" -R "$REPOSITORY" --draft --latest=false \
              --title "Virbula offline search ${INPUT_TIER} ${INPUT_VERSION}" \
              --notes "Offline ${INPUT_TIER} search indexes (SQLite FTS5), one per Geofabrik extract."
          fi

      - name: Expose the bounded plan
        id: outputs
        run: |
          set -euo pipefail
          matrix="$(jq -c . build/search-plan/matrix.json)"
          test "${#matrix}" -lt 900000
          jq -e '.include | length >= 1 and length <= 256' build/search-plan/matrix.json >/dev/null
          jq -e 'all(.include[]; (.shard | test("^[0-9]{3}$")) and (.graphIds | length >= 1))' \
            build/search-plan/matrix.json >/dev/null
          tag="$(jq -er '.releaseTag | select(test("^search-(addresses-)?[0-9]{4}\\.[0-9]{2}\\.[0-9]+$"))' build/search-plan/search-plan.json)"
          index_count="$(jq -er '.indexCount | select(type == "number" and . >= 1)' build/search-plan/search-plan.json)"
          shard_count="$(jq -er '.shardCount' build/search-plan/search-plan.json)"
          printf 'matrix=%s\nrelease_tag=%s\nindex_count=%s\nshard_count=%s\n' \
            "$matrix" "$tag" "$index_count" "$shard_count" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    if: inputs.dry_run != true
    runs-on: ubuntu-24.04
    timeout-minutes: 720
    permissions:
      contents: write
    strategy:
      fail-fast: false
      # Bounded so a full run cannot saturate the account's runner allowance
      # and stall unrelated workflows.
      max-parallel: 10
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.matrix).include }}
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPOSITORY: ${{ github.repository }}
      RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
      SHARD: ${{ matrix.shard }}
      GRAPH_IDS_JSON: ${{ toJSON(matrix.graphIds) }}
      INPUT_TIER: ${{ inputs.tier }}
      INPUT_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Reclaim runner disk
        run: |
          set -euo pipefail
          # A stock ubuntu-24.04 runner has roughly 14 GB free, and a shard may
          # carry up to 12 GB of extracts plus the indexes built from them.
          # These preinstalled toolchains are not used by this job.
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          df -h / | awk 'NR==2 {print "  free after reclaim: " $4}'

      - name: Install the extractor runtime
        run: |
          set -euo pipefail
          python3 -m venv build/osmvenv
          build/osmvenv/bin/pip install --quiet --require-hashes --no-deps \
            -r tool/offline_maps/search-requirements.txt

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: search-plan-${{ github.run_id }}
          path: build/search-plan

      - name: Build, verify and upload each index
        run: |
          set -euo pipefail
          mkdir -p build/search-work
          plan=build/search-plan/search-plan.json
          for graph_id in $(jq -er '.[]' <<< "$GRAPH_IDS_JSON"); do
            entry="$(jq -er --arg g "$graph_id" '.indexes[] | select(.graphId == $g)' "$plan")"
            url="$(jq -er '.sourceUrl' <<< "$entry")"
            want_md5="$(jq -er '.sourceMd5' <<< "$entry")"
            out_file="$(jq -er '.file' <<< "$entry")"
            raw_file="${out_file%.gz}"
            pbf="build/search-work/$graph_id.osm.pbf"

            echo "::group::$graph_id"
            curl --fail-with-body --location --silent --show-error \
              --proto '=https' --tlsv1.2 \
              --connect-timeout 15 --max-time 3600 --retry 5 \
              --retry-all-errors --retry-delay 5 \
              --output "$pbf" "$url"

            # The plan pins a checksum precisely so a corrupted or substituted
            # extract cannot be silently indexed and published.
            got_md5="$(md5sum "$pbf" | awk '{print $1}')"
            test "$got_md5" = "$want_md5" || {
              echo "ERROR: $graph_id checksum $got_md5 != $want_md5" >&2
              exit 1
            }

            # The address release is a self-contained superset: a user takes
            # one file or the other, never both. Measured smaller than the two
            # separate indexes it replaces, because one FTS5 index shares a
            # tokenizer dictionary.
            tiers=settlements,streets,pois
            if [[ "$INPUT_TIER" == addresses ]]; then
              tiers=settlements,streets,pois,addresses
            fi
            build/osmvenv/bin/python tool/offline_maps/build_search_index.py \
              --input "$pbf" \
              --output "build/search-work/$raw_file" \
              --region-id "$graph_id" \
              --version "$INPUT_VERSION" \
              --tiers "$tiers" \
              --compress \
              --descriptor "build/search-work/$graph_id.descriptor.json"

            # Freed immediately: a shard's extracts together can exceed the
            # disk that remains after reclamation if they accumulate.
            rm -f "$pbf"

            test "$(jq -er '.file' "build/search-work/$graph_id.descriptor.json")" = "$out_file"
            # Split indexes ship as independently gzipped parts, like routing
            # graphs. No per-extract index is near the 2 GiB ceiling today, but
            # the same code path has to work here or a future cycle silently
            # fails on whichever extract grows past it first.
            mapfile -t assets < <(jq -r '
              if (.parts // []) | length > 0
              then .parts[].file else .file end' \
              "build/search-work/$graph_id.descriptor.json")
            for asset in "${assets[@]}"; do
              test -f "build/search-work/$asset" || {
                echo "ERROR: missing build/search-work/$asset" >&2; exit 1; }
              gh release upload "$RELEASE_TAG" "build/search-work/$asset" \
                -R "$REPOSITORY" --clobber
              rm -f "build/search-work/$asset"
            done
            echo "::endgroup::"
          done

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: search-descriptors-${{ github.run_id }}-${{ matrix.shard }}
          path: build/search-work/*.descriptor.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 9
          overwrite: true

  finalize:
    needs: [prepare, build]
    if: inputs.dry_run != true
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPOSITORY: ${{ github.repository }}
      RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
      INDEX_COUNT: ${{ needs.prepare.outputs.index_count }}
      INPUT_TIER: ${{ inputs.tier }}
      INPUT_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: search-plan-${{ github.run_id }}
          path: build/search-plan
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: search-descriptors-${{ github.run_id }}-*
          merge-multiple: true
          path: build/search-descriptors

      - name: Require every planned index to be present and non-empty
        run: |
          set -euo pipefail
          gh release view "$RELEASE_TAG" -R "$REPOSITORY" \
            --json assets --jq '.assets[] | "\(.name) \(.size)"' \
            | sort > build/live-assets.txt
          # Compared against what each descriptor declares, not against an
          # arbitrary floor. The previous check rejected anything under 4 KB as
          # truncated, which failed the run on Pitcairn Islands (31 rows) and
          # Tokelau (16 rows) -- both perfectly valid, because a gzipped SQLite
          # for a fifty-person territory really is about 2 KB. An exact size
          # match catches genuine truncation without guessing at a minimum.
          jq -s 'map({(.file): .exactBytes})|add' \
            build/search-descriptors/*.descriptor.json > build/expected-sizes.json
          missing=0
          while read -r name; do
            want="$(jq -r --arg n "$name" '.[$n] // empty' build/expected-sizes.json)"
            got="$(awk -v n="$name" '$1 == n {print $2}' build/live-assets.txt)"
            if [[ -z "$got" ]]; then
              echo "MISSING $name" >&2; missing=1; continue
            fi
            if [[ -n "$want" && "$got" != "$want" ]]; then
              echo "SIZE MISMATCH $name: $got on the release, $want in its descriptor" >&2
              missing=1
            fi
          done < <(jq -r '.indexes[].file' build/search-plan/search-plan.json)
          test "$missing" = 0
          echo "  all $INDEX_COUNT indexes present"

      - name: Emit the search manifest the catalog generator consumes
        run: |
          set -euo pipefail
          # One descriptor per index, carrying the exact bytes and SHA-256 the
          # app verifies after download, plus the regions each index serves so
          # the catalog can attach it without recomputing the mapping.
          jq -s --arg tag "$RELEASE_TAG" --arg tier "$INPUT_TIER" \
             --arg version "$INPUT_VERSION" \
             --slurpfile plan build/search-plan/search-plan.json \
             '{schemaVersion: 1, tier: $tier, version: $version,
               releaseTag: $tag,
               indexes: [ .[] as $d
                 | ($plan[0].indexes[] | select(.file == $d.file)) as $p
                 | {graphId: $p.graphId, file: $d.file,
                    regionIds: $p.regionIds, recordCount: $d.recordCount,
                    exactBytes: $d.exactBytes, sha256: $d.sha256,
                    compression: $d.compression,
                    uncompressedBytes: $d.uncompressedBytes,
                    uncompressedSha256: $d.uncompressedSha256,
                    format: $d.format, tiers: $d.tiers,
                    sourceUrl: $p.sourceUrl, sourceMd5: $p.sourceMd5} ]
               | sort_by(.graphId) }' \
             build/search-descriptors/*.descriptor.json \
             > build/search-manifest.json
          test "$(jq '.indexes | length' build/search-manifest.json)" = "$INDEX_COUNT"
          jq -r '"  \(.indexes | length) indexes, \([.indexes[].exactBytes] | add / 1048576 | floor) MiB total"' \
            build/search-manifest.json
          gh release upload "$RELEASE_TAG" build/search-manifest.json \
            -R "$REPOSITORY" --clobber

      - name: Report
        run: |
          set -euo pipefail
          # Left as a draft on purpose. Publishing is a separate, deliberate
          # step once every family in the cycle has succeeded.
          echo "Draft $RELEASE_TAG is complete with $INDEX_COUNT indexes."
          echo "Review it, then publish with --draft=false --latest=false."
